services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slm
      POSTGRES_PASSWORD: slm
      POSTGRES_DB: slm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis also backs the BullMQ job queue; evicting keys under memory pressure would
    # silently drop queued jobs. noeviction is the image default, pinned here on purpose.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data

  # Speech recognition + Quran text alignment for recitation practice. Built from
  # services/speech; the first build converts the model and takes several minutes.
  speech:
    build:
      context: ./services/speech
      target: runtime
    image: slm-speech:dev
    restart: unless-stopped
    # Runs a tiny init as PID 1 that forwards stop signals and reaps child processes.
    # Without it, stopping the container mid-transcription left uvicorn a zombie that
    # Docker could not kill, and the forced cleanup disrupted the other containers.
    init: true
    environment:
      # Set to the machine's PHYSICAL core count. On this 2-core/4-thread i3, 2 threads
      # decoded 2.2x faster than 4 (0.85x vs 1.88x real time, measured in both run
      # orders): hyperthreads compete for the same cores on matrix-heavy work.
      CPU_THREADS: "2"
      # The numeric libraries around the decoder (OpenBLAS for audio features, OpenMP)
      # otherwise start one thread per LOGICAL CPU, oversubscribing the same 2 cores:
      # a run with only CPU_THREADS set used 400% CPU and took 9x longer than usual.
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    ports:
      - "8001:8000"
    volumes:
      # The api (running on the host) writes uploads here; the service only reads them.
      - ./apps/api/data/recitations:/data/recitations:ro

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"

volumes:
  postgres-data:
  redis-data:
  chroma-data:
